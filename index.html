  --bg: #F4EDE4;
  --bg-home: #F4EDE4;

  --bg-status: #E8DCC8;
  --bg-detail: #F1E8DB;
  --card: #FFF9F3;
  --text: #2F281F;
  --muted: #6E6258;
  --border: #C4AE94;
  --accent: #4F6B3E;
  --accent-hover: #3E552F;

}
* { box-sizing:border-box; margin:0; padding:0; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

}

}
h1 { font-size: 1.45rem; font-weight: 650; letter-spacing: -0.02em; }
.sub { color: var(--muted); font-size: 0.85rem; }
.btn { 
  background: var(--accent); 
  color: #fff; 
  border: none; 
  padding: 0.65rem 1.1rem; 
  border-radius: 12px; 
  font-size: 0.9rem; 
  cursor: pointer; 
  transition: all 0.18s ease; 
  min-height: 44px;
  font-weight: 550;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 2px rgba(107,127,90,0.15);
}
.btn:hover, .btn:active { background: var(--accent-hover); transform: translateY(-1px); }
.btn-outline { 
  background: rgba(255,255,255,0.6);

  border: 1.5px solid var(--border);

}
.btn-outline:hover, .btn-outline:active {

}

}
.item {
  position: relative;

  border: 1px solid var(--border);

}

  content: "";

}
.item:hover::before, .item:active::before { opacity: 0.7; }

#inspiration, .page#inspiration { background: #F6F1E8; }

  padding: 0.75rem 0.8rem; 
  border: 1.5px solid var(--border); 
  border-radius: 12px; 
  margin-bottom: 0.65rem; 
  font-size: 1rem; 
  font-family: inherit;

  color: var(--text);

}
.form textarea { min-height: 80px; resize: vertical; }
.chat { margin-top: 0.9rem; border-top: 1px solid var(--border); padding-top: 0.8rem; }
.msg { font-size: 0.85rem; margin-bottom: 0.5rem; }
.msg .time { color: var(--muted); font-size: 0.72rem; }
.hidden { display: none !important; }
.page-enter { animation: fadeSlideIn 0.3s ease-out forwards; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes itemIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }

.pair img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
.pair .label { font-size: 0.75rem; color: var(--muted); text-align: center; margin-bottom: 0.25rem; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin: 0.7rem 0; }

.done { opacity: 0.65; }

}
.nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.nav-btn.active {
  background: var(--accent);

  border-color: var(--accent);

}
.breadcrumb {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 0.8rem;
  padding: 0.3rem 0;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.breadcrumb strong {
  color: var(--wood-dark);
  font-weight: 600;
}

.floating-home {
  position: fixed;
  bottom: 1.2rem;
  left: 1.2rem;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  box-shadow: 0 4px 14px rgba(79, 107, 62, 0.4);

  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  transition: all 0.2s ease;
}
.floating-home:hover, .floating-home:active {
  background: var(--accent-hover);
  transform: scale(1.08);
  box-shadow: 0 6px 18px rgba(79, 107, 62, 0.5);
}
.floating-add {
  position: fixed;
  bottom: 1.2rem;
  right: 1.2rem;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  box-shadow: 0 6px 20px rgba(79, 107, 62, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 100;
  transition: all 0.2s ease;
}
.floating-add:hover, .floating-add:active {
  background: var(--accent-hover);
  transform: scale(1.1);
  box-shadow: 0 8px 24px rgba(79, 107, 62, 0.55);

@media (max-width: 480px) {
  .floating-home {
    bottom: 1rem;

  h1 { font-size: 1.25rem; }
  .topbar { flex-direction: column; align-items: stretch; gap: 0.5rem; }
  .title-wrap { justify-content: center; }
  .nav { justify-content: space-between; gap: 0.3rem; }
  .nav .btn { flex: 1; min-width: 0; padding: 0.5rem 0.3rem; font-size: 0.75rem; }

  #filterBar { flex-direction: column; gap: 0.4rem; }
  #filterBar select { width: 100%; min-width: 0; }
  .item { padding: 0.9rem; }
  .leaf-icon { width: 26px; height: 26px; }
}

<body>
<div id="app">
  <div class="topbar">
    <div class="title-wrap">
      <svg class="leaf-icon" viewBox="0 0 24 24" fill="none" stroke="#6B3E1F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22c0-8-4-12-8-14 0 0 2 8 8 10 6-2 8-10 8-10-4 2-8 6-8 14z"/>
        <path d="M12 22V12"/>
      </svg>
      <div>
        <h1>שיפוץ בית משפחת קרן, המייסדים</h1>
        <div class="sub">רשימת מרכיבים</div>
      </div>
    </div>
    <div class="nav">
      <button class="btn btn-outline btn-small nav-btn" data-page="home" onclick="goHome()">עמוד הבית</button>
      <button class="btn btn-outline btn-small nav-btn" data-page="gallery" onclick="showPage('gallery')">גלריה</button>
      <button class="btn btn-outline btn-small nav-btn" data-page="inspiration" onclick="showPage('inspiration')">רעיונות</button>
      <button class="btn btn-outline btn-small nav-btn" data-page="status" onclick="showPage('status')">תמונת מצב</button>
      <button class="btn btn-outline btn-small" onclick="exportToExcel()">ייצוא לאקסל</button>
    </div>
  </div>
  <div class="decor-line"></div>
  <div id="breadcrumb" class="breadcrumb">בית</div>

  <div id="home">
    <div id="addForm" class="form hidden">
      <input id="name" placeholder="שם המרכיב">
      <select id="area">
        <option value="">בחר אזור</option>
        <option>כניסה</option><option>סלון</option><option>מטבח</option>
        <option>חדר שינה הורים</option><option>חדר ילדים</option><option>חדר רחצה</option>
        <option>שירותים</option><option>חוץ / חזית</option><option>מרפסת</option><option>אחר</option>
      </select>
      <textarea id="desc" placeholder="תיאור השיפוץ הרצוי"></textarea>
      <input id="cost" type="number" placeholder="מחיר צפוי (ש״ח)">
      <input id="actual" type="number" placeholder="עלות בפועל (ש״ח)">
      <select id="priority">
        <option value="high">עדיפות גבוהה</option>
        <option value="medium" selected>עדיפות בינונית</option>
        <option value="low">עדיפות נמוכה</option>
      </select>
      <div style="display:flex; gap:0.4rem;">
        <button class="btn" onclick="saveItem()">שמור</button>
        <button class="btn btn-outline" onclick="hideAdd()">ביטול</button>
      </div>
    </div>
    <div id="filterBar">
      <select id="areaFilter" onchange="renderList()">
        <option value="">כל האזורים</option>
        <option>כניסה</option>
        <option>סלון</option>
        <option>מטבח</option>
        <option>חדר שינה הורים</option>
        <option>חדר ילדים</option>
        <option>חדר רחצה</option>
        <option>שירותים</option>
        <option>חוץ / חזית</option>
        <option>מרפסת</option>
        <option>אחר</option>
      </select>
      <select id="priceFilter" onchange="renderList()">
        <option value="">כל המחירים</option>
        <option value="0-1000">עד 1,000 ש״ח</option>
        <option value="1000-5000">1,000 - 5,000</option>
        <option value="5000-10000">5,000 - 10,000</option>
        <option value="10000-20000">10,000 - 20,000</option>
        <option value="20000-">מעל 20,000</option>
      </select>
      <select id="priorityFilter" onchange="renderList()">
        <option value="">כל העדיפויות</option>
        <option value="high">עדיפות גבוהה</option>
        <option value="medium">עדיפות בינונית</option>
        <option value="low">עדיפות נמוכה</option>
      </select>
    </div>
    <div id="list"></div>
  </div>

  <div id="detail" class="detail hidden"></div>
  <div id="gallery" class="page hidden"></div>
  <div id="inspiration" class="page hidden"></div>
  <div id="status" class="page hidden"></div>
</div>

<button class="floating-home" onclick="goHome()" title="חזרה לעמוד הבית">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
  </svg>
</button>

<button class="floating-add" id="floatingAdd" onclick="handleFloatingAdd()" title="הוסף">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<script>
let items = [];
let gallery = [];
let inspiration = [];
let currentPage = 'home';

function showWithAnim(el) {
  if (!el) return;
  el.classList.remove('hidden');
  el.classList.remove('page-enter');
  void el.offsetWidth; // force reflow
  el.classList.add('page-enter');
}

function setActiveNav(page) {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
}

function updateBreadcrumb(text) {
  const el = document.getElementById('breadcrumb');
  if (el) el.innerHTML = text;
}

function goHome() {
  currentPage = 'home';
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('gallery').classList.add('hidden');
  document.getElementById('inspiration').classList.add('hidden');
  document.getElementById('status').classList.add('hidden');
  showWithAnim(document.getElementById('home'));
  renderList();
  updateBreadcrumb('<strong>בית</strong>');
  setActiveNav('home');
  updateFloatingAdd();
}

function showPage(page) {
  currentPage = page;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('gallery').classList.add('hidden');
  document.getElementById('inspiration').classList.add('hidden');
  document.getElementById('status').classList.add('hidden');
  if (page === 'gallery') {
    renderGallery();
    updateBreadcrumb('בית › <strong>גלריה</strong>');
    setActiveNav('gallery');
  }
  if (page === 'inspiration') {
    renderInspiration();
    updateBreadcrumb('בית › <strong>רעיונות שאהבנו</strong>');
    setActiveNav('inspiration');
  }
  if (page === 'status') {
    renderStatus();
    updateBreadcrumb('בית › <strong>תמונת מצב</strong>');
    setActiveNav('status');
  }
  showWithAnim(document.getElementById(page));
  updateFloatingAdd();
}

const fallbackItems = [
  {"area":"כניסה","cost":0,"created":1795359241291,"desc":"החלפת דלת ומשקוף כניסה","name":"דלת כניסה","priority":"high"},
  {"area":"כניסה","cost":0,"created":1795359271042,"desc":"החלפת לבני הזכוכית וביטולן","name":"לבני זכוכית","priority":"high"},
  {"area":"חוץ / חזית","cost":0,"created":1795359331627,"desc":"העברת המחסן מהפרגולה לפםינת המגרש","name":"מחסן חוץ","priority":"high"},
  {"area":"חוץ / חזית","cost":0,"created":1795359365697,"desc":"הקמת גדר היקפית או לפחות חזיתית","name":"גדר","priority":"medium"},
  {"area":"חדר רחצה","cost":0,"created":1795359422416,"desc":"ביטול אמבטיה והקמת מקלחת מפנקת","name":"אמבטיה אגם","priority":"high"},
  {"area":"חוץ / חזית","cost":0,"created":1795371584784,"desc":"תאורה היקפית סביב קירות הבית והכניסה","name":"תאורת חוץ","priority":"high"},
  {"actual":0,"area":"חוץ / חזית","cost":0,"created":1795426025674,"desc":"החלפת הריצוף בבטון מוחלק או דומיט","done":false,"name":"שביל כניסה לבית","priority":"medium"},
  {"actual":0,"area":"מרפסת","cost":0,"created":1795433449496,"desc":"הכנסת שטח הפאטיו לחלל תוך הבית","done":false,"name":"פאטיו","priority":"high"}
];

function load() {
  // טען קודם מהגיבוי המקומי או מהנתונים הקבועים
  try {
    const cached = localStorage.getItem('renovation_items');
    if (cached) {
      items = JSON.parse(cached);
    } else {
      items = fallbackItems;
    }
    if (currentPage === 'home') renderList();
  } catch(e) {
    items = fallbackItems;
    if (currentPage === 'home') renderList();
  }

  db.ref('items').on('value', snap => {
    const val = snap.val();
    console.log('Firebase items:', val);
    if (val && (Array.isArray(val) ? val.length : Object.keys(val).length)) {
      items = Array.isArray(val) ? val : Object.values(val);
      try { localStorage.setItem('renovation_items', JSON.stringify(items)); } catch(e) {}
    }
    if (currentPage === 'home') renderList();
    if (currentPage === 'status') renderStatus();
  }, err => {
    console.error('Firebase error:', err);
    if (!items.length) {
      items = fallbackItems;
      if (currentPage === 'home') renderList();
    }
  });
  db.ref('gallery').on('value', snap => {
    gallery = snap.val() || [];
    if (!Array.isArray(gallery)) gallery = Object.values(gallery);
    if (currentPage === 'gallery') renderGallery();
  });
  db.ref('inspiration').on('value', snap => {
    inspiration = snap.val() || [];
    if (!Array.isArray(inspiration)) inspiration = Object.values(inspiration);
    if (currentPage === 'inspiration') renderInspiration();
  });
}

function getAreaIcon(area) {
  const icons = {
    'כניסה': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><path d="M3 21V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v16"/><path d="M9 21V9h6v12"/><circle cx="14" cy="15" r="0.8" fill="#8B6F47"/></svg>`,
    'סלון': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><path d="M4 10h16v8H4z"/><path d="M4 14h16"/><path d="M7 10V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/></svg>`,
    'מטבח': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><path d="M4 6h16v12H4z"/><path d="M8 6v12"/><path d="M12 10h4"/><circle cx="16" cy="14" r="1"/></svg>`,
    'חדר שינה הורים': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><path d="M3 18V8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10"/><path d="M3 14h18"/><path d="M7 10h4"/></svg>`,
    'חדר ילדים': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><circle cx="12" cy="8" r="3"/><path d="M6 20v-4a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v4"/></svg>`,
    'חדר רחצה': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><path d="M6 6h12v4H6z"/><path d="M8 10v8a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-8"/><path d="M10 4v2"/></svg>`,
    'שירותים': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><path d="M8 4h8v16H8z"/><path d="M12 8v4"/><circle cx="12" cy="16" r="1"/></svg>`,
    'חוץ / חזית': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><path d="M3 20h18"/><path d="M5 20V10l7-6 7 6v10"/><path d="M9 20v-6h6v6"/></svg>`,
    'מרפסת': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><path d="M4 18h16"/><path d="M6 18V8l6-4 6 4v10"/><path d="M10 18v-4h4v4"/></svg>`,
    'אחר': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B6F47" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>`
  };
  return icons[area] || '';
}

function renderList() {
  const areaFilterEl = document.getElementById('areaFilter');
  const priceFilterEl = document.getElementById('priceFilter');
  const priorityFilterEl = document.getElementById('priorityFilter');
  const areaFilter = areaFilterEl ? areaFilterEl.value : '';
  const priceFilter = priceFilterEl ? priceFilterEl.value : '';
  const priorityFilter = priorityFilterEl ? priorityFilterEl.value : '';

  let filtered = items;
  if (areaFilter) {
    filtered = filtered.filter(it => (it.area || '') === areaFilter);
  }
  if (priceFilter) {
    filtered = filtered.filter(it => {
      const cost = Number(it.cost) || 0;
      if (priceFilter === '0-1000') return cost <= 1000;
      if (priceFilter === '1000-5000') return cost >= 1000 && cost <= 5000;
      if (priceFilter === '5000-10000') return cost >= 5000 && cost <= 10000;
      if (priceFilter === '10000-20000') return cost >= 10000 && cost <= 20000;
      if (priceFilter === '20000-') return cost >= 20000;
      return true;
    });
  }
  if (priorityFilter) {
    filtered = filtered.filter(it => (it.priority || 'medium') === priorityFilter);
  }

  const sorted = [...filtered].sort((a,b) => ({high:0,medium:1,low:2}[a.priority||'medium'] - {high:0,medium:1,low:2}[b.priority||'medium']));
  const emptyMsg = (areaFilter || priceFilter || priorityFilter) ? 'אין רכיבים התואמים את הסינון' : 'אין עדיין מרכיבים';
  document.getElementById('list').innerHTML = sorted.map(it => {
    const idx = items.indexOf(it);
    return `<div class="item ${it.done?'done':''}" onclick="openDetail(${idx})">
      <div class="item-header">
        <div class="item-name">${it.name||''} ${it.done?'✓':''}</div>
        <div class="priority">${{high:'גבוהה',medium:'בינונית',low:'נמוכה'}[it.priority]||''}</div>
      </div>
      <div class="item-meta">${getAreaIcon(it.area)} ${it.area||'—'} · ${(it.cost||0).toLocaleString()} ש״ח</div>
      ${it.desc?`<div style="font-size:0.85rem;margin-top:0.3rem;">${it.desc}</div>`:''}
    </div>`;
  }).join('') || `<p style="color:#999;">${emptyMsg}</p>`;
}

function updateFloatingAdd() {
  const btn = document.getElementById('floatingAdd');
  if (!btn) return;
  if (currentPage === 'status' || currentPage === 'detail') {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'flex';
  if (currentPage === 'home') {
    btn.title = 'הוסף רכיב שיפוץ';
  } else if (currentPage === 'gallery') {
    btn.title = 'הוסף תמונה לגלריה';
  } else if (currentPage === 'inspiration') {
    btn.title = 'הוסף רעיון / תמונה';
  }
}

function handleFloatingAdd() {
  if (currentPage === 'home') {
    showAdd();
  } else if (currentPage === 'gallery') {
    // Scroll to the upload form in gallery
    const form = document.querySelector('#gallery .form');
    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const fileInput = document.getElementById('gBefore');
    if (fileInput) fileInput.click();
  } else if (currentPage === 'inspiration') {
    const form = document.querySelector('#inspiration .form');
    if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const fileInput = document.getElementById('inspFiles');
    if (fileInput) fileInput.click();
  }
}

function showAdd() {
  document.getElementById('addForm').classList.remove('hidden');
  document.getElementById('addForm').dataset.editIdx = '';
  document.querySelector('#addForm .btn').textContent = 'שמור';
}
function hideAdd() { document.getElementById('addForm').classList.add('hidden'); }

function saveItems() {
  db.ref('items').set(items);
  try { localStorage.setItem('renovation_items', JSON.stringify(items)); } catch(e) {}
}

function saveItem() {
  const name = document.getElementById('name').value.trim();
  if (!name) return alert('נא למלא שם');
  const editIdx = document.getElementById('addForm').dataset.editIdx;
  const item = {
    name,
    area: document.getElementById('area').value,
    desc: document.getElementById('desc').value.trim(),
    cost: Number(document.getElementById('cost').value)||0,
    actual: Number(document.getElementById('actual').value)||0,
    priority: document.getElementById('priority').value,
    done: editIdx!=='' ? (items[editIdx].done||false) : false,
    comments: editIdx!=='' ? (items[editIdx].comments||[]) : [],
    created: editIdx!=='' ? items[editIdx].created : Date.now()
  };
  if (editIdx !== '') items[editIdx] = item;
  else items.push(item);
  saveItems();
  hideAdd();
  ['name','desc','cost','actual'].forEach(id => document.getElementById(id).value='');
}

function openDetail(idx) {
  currentPage = 'detail';
  document.getElementById('home').classList.add('hidden');
  document.getElementById('gallery').classList.add('hidden');
  document.getElementById('inspiration').classList.add('hidden');
  document.getElementById('status').classList.add('hidden');
  showWithAnim(document.getElementById('detail'));
  renderDetail(idx);
  const name = items[idx]?.name || 'פריט';
  updateBreadcrumb(`בית › <strong>${name}</strong>`);
  setActiveNav('home');
  updateFloatingAdd();
}

function renderDetail(idx) {
  const it = items[idx];
  if (!it) return;
  const comments = it.comments||[];
  document.getElementById('detail').innerHTML = `
    <button class="btn btn-outline btn-small" onclick="goHome()" style="margin-bottom:0.7rem;">← חזרה לרשימה</button>
    <div class="item-name" style="font-size:1.1rem;">${it.name} ${it.done?'✓':''}</div>
    <div class="item-meta">${getAreaIcon(it.area)} ${it.area||'—'} · צפוי ${(it.cost||0).toLocaleString()} ש״ח · בפועל ${(it.actual||0).toLocaleString()} ש״ח</div>
    ${it.desc?`<div style="margin:0.5rem 0;">${it.desc}</div>`:''}
    <div style="margin:0.6rem 0; display:flex; gap:0.4rem; flex-wrap:wrap;">
      <button class="btn btn-small" onclick="editItem(${idx})">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:4px;">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        ערוך
      </button>
      <button class="btn btn-outline btn-small" onclick="toggleDone(${idx})">${it.done?'בטל בוצע':'סמן בוצע'}</button>
      <button class="btn btn-outline btn-small" onclick="deleteItem(${idx})">מחק</button>
    </div>
    <div class="chat">
      <div style="font-weight:600; margin-bottom:0.4rem;">צ׳אט</div>
      ${comments.map(c=>`<div class="msg"><strong>${c.user||'משתמש'}</strong> <span class="time">${new Date(c.time).toLocaleString('he-IL')}</span><br>${c.text}</div>`).join('')||'<div style="color:#999;font-size:0.8rem;">אין הערות</div>'}
      <div style="display:flex; gap:0.3rem; margin-top:0.5rem;">
        <input id="chatInput" placeholder="הערה..." style="flex:1; padding:0.4rem; border:1px solid #e5e5e5; border-radius:6px;">
        <button class="btn btn-small" onclick="addChat(${idx})">שלח</button>
      </div>
    </div>
  `;
}

function editItem(idx) {
  const it = items[idx];
  document.getElementById('name').value = it.name||'';
  document.getElementById('area').value = it.area||'';
  document.getElementById('desc').value = it.desc||'';
  document.getElementById('cost').value = it.cost||'';
  document.getElementById('actual').value = it.actual||'';
  document.getElementById('priority').value = it.priority||'medium';
  document.getElementById('addForm').classList.remove('hidden');
  document.getElementById('addForm').dataset.editIdx = idx;
  document.querySelector('#addForm .btn').textContent = 'שמור שינויים';
  goHome();
  document.getElementById('addForm').scrollIntoView();
}

function toggleDone(idx) {
  items[idx].done = !items[idx].done;
  saveItems();
  renderDetail(idx);
}

function deleteItem(idx) {
  if (!confirm('למחוק?')) return;
  items.splice(idx,1);
  saveItems();
  goHome();
}

function addChat(idx) {
  const text = document.getElementById('chatInput').value.trim();
  if (!text) return;
  if (!items[idx].comments) items[idx].comments = [];
  items[idx].comments.push({ user:'משתמש', text, time:Date.now() });
  saveItems();
}

function renderGallery() {
  document.getElementById('gallery').innerHTML = `
    <button class="btn btn-outline btn-small" onclick="goHome()" style="margin-bottom:0.7rem;">← חזרה לרשימה</button>
    <div class="page-title">📷 גלריה – לפני ואחרי</div>
    <div class="form" style="margin-bottom:0.8rem;">
      <input id="gLabel" placeholder="שם הפריט / אזור">
      <label style="font-size:0.8rem;">תמונת לפני</label>
      <input type="file" id="gBefore" accept="image/*">
      <label style="font-size:0.8rem;">תמונת אחרי</label>
      <input type="file" id="gAfter" accept="image/*">
      <button class="btn" style="margin-top:0.4rem;" onclick="addGallery()">הוסף תמונה</button>
    </div>
    <div class="gallery-grid" id="gGrid"></div>
  `;
  const grid = document.getElementById('gGrid');
  gallery.forEach((p,i) => {
    const div = document.createElement('div');
    div.className = 'pair';
    div.innerHTML = `
      <div class="label">${p.label||''}</div>
      <div style="display:flex; gap:0.3rem;">
        <div style="flex:1;"><div class="label">לפני</div>${p.before?`<img src="${p.before}" loading="lazy" alt="לפני">`:''}</div>
        <div style="flex:1;"><div class="label">אחרי</div>${p.after?`<img src="${p.after}" loading="lazy" alt="אחרי">`:`<div style="height:110px;background:#f5f5f5;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:0.75rem;">+ אחרי</div>`}</div>
      </div>
    `;
    grid.appendChild(div);
  });
}

function addGallery() {
  const label = document.getElementById('gLabel').value.trim()||'פריט';
  const bIn = document.getElementById('gBefore');
  const aIn = document.getElementById('gAfter');
  const pair = { label, before:'', after:'' };
  const read = (inp, key) => new Promise(res => {
    if (!inp.files?.[0]) return res();
    const r = new FileReader();
    r.onload = e => { pair[key]=e.target.result; res(); };
    r.readAsDataURL(inp.files[0]);
  });
  Promise.all([read(bIn,'before'), read(aIn,'after')]).then(() => {
    if (!pair.before) return alert('נא לבחור תמונת לפני');
    gallery.push(pair);
    db.ref('gallery').set(gallery);
  });
}

function renderInspiration() {
  document.getElementById('inspiration').innerHTML = `
    <button class="btn btn-outline btn-small" onclick="goHome()" style="margin-bottom:0.7rem;">← חזרה לרשימה</button>
    <div class="page-title">💡 רעיונות שאהבנו</div>
    <div class="form" style="margin-bottom:0.8rem; background:var(--wood-soft);">
      <input id="inspLabel" placeholder="תיאור / רעיון (אופציונלי)">
      <label style="font-size:0.8rem;">בחר תמונות</label>
      <input type="file" id="inspFiles" accept="image/*" multiple>
      <button class="btn" style="margin-top:0.4rem;" onclick="addInspiration()">הוסף תמונות</button>
    </div>
    <div class="gallery-grid" id="inspGrid"></div>
  `;
  const grid = document.getElementById('inspGrid');
  inspiration.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'pair';
    div.innerHTML = `
      <div class="label">${p.label || 'השראה'}</div>
      <img src="${p.image}" alt="רעיון" loading="lazy">
      <button class="btn btn-outline btn-small" style="margin-top:0.3rem; width:100%;" onclick="deleteInspiration(${i})">מחק</button>
    `;
    grid.appendChild(div);
  });
}

function addInspiration() {
  const label = document.getElementById('inspLabel').value.trim() || 'השראה';
  const files = document.getElementById('inspFiles').files;
  if (!files || files.length === 0) return alert('נא לבחור לפחות תמונה אחת');
  const promises = Array.from(files).map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => resolve({ label, image: e.target.result });
    reader.readAsDataURL(file);
  }));
  Promise.all(promises).then(newItems => {
    inspiration.push(...newItems);
    db.ref('inspiration').set(inspiration);
  });
}

function deleteInspiration(idx) {
  if (!confirm('למחוק את התמונה?')) return;
  inspiration.splice(idx, 1);
  db.ref('inspiration').set(inspiration);
}

function renderStatus() {
  const total = items.reduce((s,c)=>s+(c.cost||0),0);
  const actual = items.reduce((s,c)=>s+(c.actual||0),0);
  const done = items.filter(c=>c.done).length;
  const left = items.length - done;
  const byPri = { high:0, medium:0, low:0 };
  items.forEach(c => byPri[c.priority||'medium']++);
  document.getElementById('status').innerHTML = `
    <button class="btn btn-outline btn-small" onclick="goHome()" style="margin-bottom:0.7rem;">← חזרה לרשימה</button>
    <div class="page-title">📊 תמונת מצב</div>
    <div class="stats">
      <div class="stat"><div class="num">${done}</div><div class="lbl">בוצע</div></div>
      <div class="stat"><div class="num">${left}</div><div class="lbl">נותר לבצע</div></div>
      <div class="stat"><div class="num">${total.toLocaleString()}</div><div class="lbl">סה״כ תקציב (ש״ח)</div></div>
      <div class="stat"><div class="num">${actual.toLocaleString()}</div><div class="lbl">סה״כ עלה בפועל</div></div>
    </div>
    <div style="margin-top:0.8rem; font-size:0.9rem;">
      <div>עדיפות גבוהה: ${byPri.high}</div>
      <div>עדיפות בינונית: ${byPri.medium}</div>
      <div>עדיפות נמוכה: ${byPri.low}</div>
    </div>
    <div style="margin-top:1rem;">
      <button class="btn" onclick="exportToExcel()">ייצוא כל הרכיבים לאקסל</button>
    </div>
  `;
}

function exportToExcel() {
  if (!items || items.length === 0) {
    alert('אין רכיבים לייצוא');
    return;
  }
  if (typeof XLSX === 'undefined') {
    alert('ספריית Excel עדיין נטענת. נסה שוב בעוד רגע.');
    return;
  }
  const data = items.map(it => {
    const priorityMap = { high: 'גבוהה', medium: 'בינונית', low: 'נמוכה' };
    const commentsText = (it.comments || []).map(c => {
      const t = c.time ? new Date(c.time).toLocaleString('he-IL') : '';
      return `[${c.user || 'משתמש'} ${t}] ${c.text || ''}`;
    }).join('\n');
    return {
      'שם': it.name || '',
      'אזור': it.area || '',
      'תיאור': it.desc || '',
      'עדיפות': priorityMap[it.priority] || it.priority || '',
      'עלות צפויה': it.cost || 0,
      'עלות בפועל': it.actual || 0,
      'סטטוס': it.done ? 'בוצע' : 'לא בוצע',
      'תאריך יצירה': it.created ? new Date(it.created).toLocaleDateString('he-IL') : '',
      'הערות': commentsText
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  // רוחב עמודות נוח
  ws['!cols'] = [
    { wch: 25 }, // שם
    { wch: 18 }, // אזור
    { wch: 45 }, // תיאור
    { wch: 12 }, // עדיפות
    { wch: 14 }, // עלות צפויה
    { wch: 14 }, // עלות בפועל
    { wch: 12 }, // סטטוס
    { wch: 16 }, // תאריך
    { wch: 60 }  // הערות
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'רכיבי שיפוץ');
  const filename = `שיפוץ-מייסדים-347-${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, filename);
}

load();
goHome();
updateBreadcrumb('<strong>בית</strong>');
</script>
</body>
